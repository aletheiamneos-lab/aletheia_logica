services:
  - type: web
    name: aletheia-logica
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_REPORTS_BUCKET
        value: generated-reports
      - key: LOGICA_GMAIL_ADDRESS
        sync: false
      - key: LOGICA_GMAIL_APP_PASSWORD
        sync: false
